# Checks every push, including the branches ManifestUI Studio saves to, so a
# change that breaks the project shows up on its commit / pull request.
name: ManifestUI checks

on:
  push:
  workflow_dispatch:

permissions:
  # Write only to commit an updated pnpm-lock.yaml back to the branch (see "Install dependencies").
  contents: write

concurrency:
  group: manifestui-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, schema and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # The checks never connect to a database or Supabase, so placeholders are
      # enough. Add repository secrets with the same names to use real values.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder' }}
      NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL || 'http://localhost:3000' }}
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      AUTH_WEBHOOK_SECRET: ci-placeholder
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      DIRECT_DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # A commit that changes package.json without pnpm-lock.yaml (ManifestUI Studio
      # adding packages, for example) would fail a frozen install. Then the lockfile
      # is updated here and committed back to the branch, and the checks below run
      # against it. Commits made with GITHUB_TOKEN don't start another run.
      - name: Install dependencies
        id: install
        run: |
          if pnpm install --frozen-lockfile; then exit 0; fi
          echo "::notice title=Lockfile updated::pnpm-lock.yaml didn't match package.json; updating it."
          pnpm install --no-frozen-lockfile
          if git diff --quiet -- pnpm-lock.yaml; then exit 0; fi
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Commit the updated lockfile
        if: steps.install.outputs.updated == 'true' && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Update pnpm-lock.yaml to match package.json"
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning title=Lockfile not pushed::Couldn't push the updated pnpm-lock.yaml (protected branch?). Run pnpm install and commit it."

      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Check layer boundaries
        run: pnpm check:boundaries

      - name: Check the Drizzle schema
        # Turns the schema into SQL without a database: fails on broken table definitions.
        run: pnpm exec drizzle-kit export --sql > /dev/null

      - name: Build
        run: pnpm build
